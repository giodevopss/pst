# fly.pst2.toml — app pst2-rxovda (banco SQLite separado do pst-gs1z4w)
# Volume: fly volumes create copa_data --size 1 --region gru -a pst2-rxovda
# Deploy: fly deploy -a pst2-rxovda --config fly.pst2.toml \
#   --build-arg NEXT_PUBLIC_SITE_URL=https://pst2-rxovda.fly.dev ...

app = 'pst2-rxovda'
primary_region = 'gru'

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"

[mounts]
  source = "copa_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
